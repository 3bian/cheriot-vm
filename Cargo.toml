[package]
name = "cheriot-vm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A modular RISC-V and CHERIoT emulator written in Rust"
readme = "README.md"

[features]
default = []
gdb = ["dep:gdbstub"]
verification = []

[dependencies]
elf = { version = "0.8", default-features = false }
gdbstub = { version = "0.7.10", optional = true, default-features = false, features = ["paranoid_unsafe", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = { version = "0.8", default-features = false, features = ["uapi_v2"] }
i2cdev = "0.6.2"
nix = { version = "0.31", default-features = false, features = ["fs", "net", "poll", "term"] }
spidev = "0.7.1"
tun = { version = "0.8.14", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true

[[test]]
name = "cheriot_spec_contract"
path = "tests/cheriot1/spec_contract.rs"
