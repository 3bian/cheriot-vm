# A Sonata 1.x board. Its bootloader appears as a USB drive and loads the UF2 copied to
# it. Pair with the sonata-1.1 board, which selects the UF2 layout. The drive is found by its
# label wherever it is mounted; use --to DIR to copy somewhere else.
description = "Sonata 1.x board over its USB mass-storage bootloader"

[package]
format = "uf2"

[flash]
volume = "SONATA"
