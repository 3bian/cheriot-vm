name = "sonata-0.2"
cpu = "cheriot-ibex"
defines = [
    "IBEX",
    "SONATA=200",
    "SUNBURST",
    "DEFAULT_UART_BAUD_RATE=115200",
    "ipconfigDRIVER_INCLUDED_RX_IP_CHECKSUM=1",
    "ipconfigDRIVER_INCLUDED_TX_IP_CHECKSUM=1",
    "CHERIOT_NO_SAIL_83",
]
driver_includes = [
    "${sdk}/include/platform/sunburst/v0.2",
    "${sdk}/include/platform/sunburst",
    "${sdk}/include/platform/generic-riscv",
]
interrupts = [
    { edge_triggered = true, name = "UartRxWatermark", number = 2, priority = 3 },
    { name = "EthernetInterrupt", number = 47, priority = 3 },
]
packaging = "sonata_legacy"
revokable_memory_start = 1048576
revoker = "software"
simulation = false
tickrate_hz = 100
timer_hz = 30000000

