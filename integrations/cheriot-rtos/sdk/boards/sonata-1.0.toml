name = "sonata-1.0"
extends = "sonata-1.1.toml"

[[patches]]
op = "replace"
path = "/defines/1"
value = "SONATA=10000"

[[patches]]
op = "add"
path = "/defines/0"
value = "CHERIOT_NO_SAIL_83"

[[patches]]
op = "add"
path = "/cxflags"
value = [
    "-mllvm",
    "-enable-machine-outliner=never",
]
