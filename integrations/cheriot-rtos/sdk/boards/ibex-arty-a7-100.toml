name = "ibex-arty-a7-100"
extends = "ibex-safe-simulator.toml"

[[patches]]
op = "add"
path = "/devices/gpio_led0"

[patches.value]
length = 2048
start = 2399203328

[[patches]]
op = "add"
path = "/devices/kunyan_ethernet"

[patches.value]
end = 335577088
start = 335560704

[[patches]]
op = "add"
path = "/interrupts/1"

[patches.value]
name = "UARTInterrupt"
edge_triggered = true
number = 2
priority = 3

[[patches]]
op = "add"
path = "/interrupts/2"

[patches.value]
name = "EthernetTransmitInterrupt"
number = 3
priority = 3

[[patches]]
op = "add"
path = "/interrupts/3"

[patches.value]
name = "EthernetReceiveInterrupt"
number = 4
priority = 3

[[patches]]
op = "add"
path = "/driver_includes/0"
value = "${sdk}/include/platform/synopsis"

[[patches]]
op = "add"
path = "/driver_includes/0"
value = "${sdk}/include/platform/arty-a7"

[[patches]]
op = "replace"
path = "/timer_hz"
value = 33000000

[[patches]]
op = "replace"
path = "/tickrate_hz"
value = 100

[[patches]]
op = "remove"
path = "/simulation"

[[patches]]
op = "remove"
path = "/audit_run_command"

[[patches]]
op = "remove"
path = "/packaging"
