name = "sonata-1.1"
cpu = "cheriot-ibex"
defines = [
    "IBEX",
    "SONATA=10100",
    "SUNBURST",
    "ipconfigDRIVER_INCLUDED_RX_IP_CHECKSUM=1",
    "ipconfigDRIVER_INCLUDED_TX_IP_CHECKSUM=1",
    "STDERR_TO_STDOUT=1",
]
driver_includes = [
    "${sdk}/include/platform/sunburst",
    "${sdk}/include/platform/ibex",
    "${sdk}/include/platform/generic-riscv",
]
interrupts = [
    { edge_triggered = true, name = "RevokerInterrupt", number = 1, priority = 2 },
    { name = "EthernetInterrupt", number = 2, priority = 3 },
    { name = "UsbDevInterrupt", number = 3, priority = 3 },
    { name = "Uart0Interrupt", number = 8, priority = 3 },
    { name = "Uart1Interrupt", number = 9, priority = 3 },
    { name = "Uart2Interrupt", number = 10, priority = 3 },
    { name = "I2c0Interrupt", number = 16, priority = 3 },
    { name = "I2c1Interrupt", number = 17, priority = 3 },
    { name = "SpiLcdInterrupt", number = 24, priority = 3 },
    { name = "SpiEthmacInterrupt", number = 25, priority = 3 },
    { name = "Spi0Interrupt", number = 26, priority = 3 },
    { name = "Spi1Interrupt", number = 27, priority = 3 },
    { name = "Spi2Interrupt", number = 28, priority = 3 },
]
packaging = "sonata_v1"
revokable_memory_start = 1048576
revoker = "hardware"
simulation = false
tickrate_hz = 100
timer_hz = 40000000

