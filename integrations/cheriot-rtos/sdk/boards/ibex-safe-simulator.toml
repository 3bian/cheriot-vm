name = "ibex-safe-simulator"
audit_run_command = "${sdk}/scripts/msft-safe-run-sim.sh ibex"
cpu = "cheriot-ibex"
defines = [
    "IBEX",
    "MICROSOFT_CHERIOT_SAFE",
]
driver_includes = [
    "${sdk}/include/platform/ibex",
    "${sdk}/include/platform/microsoft_cheriot_safe",
    "${sdk}/include/platform/generic-riscv",
]
interrupts = [
    { edge_triggered = true, name = "RevokerInterrupt", number = 1, priority = 2 },
]
packaging = "microsoft_safe"
revoker = "hardware"
simulation = true
tickrate_hz = 10
timer_hz = 100000

[devices.clint]
length = 4096
start = 335548416

[devices.plic]
end = 272629760
start = 268435456

[devices.revoker]
length = 4096
start = 335544320

[devices.uart]
end = 2399187200
start = 2399186944

[devices.shadow]
length = 8192
start = 537911296

[instruction_memory]
end = 537395200
start = 537133056

[heap]
end = 537395200
