name = "compartmentalisation"
board = "../../sdk/boards/ibex-safe-simulator.toml"
include = [
    "../../sdk/cheriot.toml",
]
sdk = "../../sdk"

[services.js]
kind = "compartment"

[services.js.build]
# The pinned exercise calls heap_quota_remaining without including allocator.h.
# Clang 23.1.3 also crashes on this source at -Oz and -O1; -O0 builds it.
sources = [
    { cpp_flags = ["-O0"], force_includes = ["${sdk}/include/allocator.h"], path = "js.cc" },
    "secret.cc",
]

[[firmwares]]
name = "javascript"
libraries = [
    "crt",
    "freestanding",
    "string",
    "microvium",
    "atomic_fixed",
    "debug",
]
services = [
    "js",
]

[[firmwares.threads]]
name = "js"
compartment = "js"
entry = "run"
priority = 1
stack_size = 2048
trusted_stack_frames = 4
