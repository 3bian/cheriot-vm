name = "error-handling"
board = "../../sdk/boards/sail.toml"
include = [
    "../../sdk/cheriot.toml",
]
sdk = "../../sdk"

[services.uart]
kind = "compartment"

[services.uart.build]
sources = [
    "uart.cc",
]

[services.hello]
kind = "compartment"

[services.hello.build]
sources = [
    "hello.cc",
]

[[firmwares]]
name = "error_handling"
libraries = [
    "freestanding",
    "debug",
]
services = [
    "hello",
    "uart",
]

[[firmwares.threads]]
name = "hello"
compartment = "hello"
entry = "entry"
priority = 1
stack_size = 1024
trusted_stack_frames = 2
