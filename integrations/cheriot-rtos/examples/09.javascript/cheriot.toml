name = "javascript"
board = "../../sdk/boards/sail.toml"
include = [
    "../../sdk/cheriot.toml",
]
sdk = "../../sdk"

[services.hello]
kind = "compartment"

[services.hello.build]
sources = [
    "hello.cc",
]

[[firmwares]]
name = "javascript"
libraries = [
    "microvium",
    "debug",
]
services = [
    "hello",
]

[[firmwares.threads]]
name = "hello"
compartment = "hello"
entry = "say_hello"
priority = 1
stack_size = 2048
trusted_stack_frames = 4
