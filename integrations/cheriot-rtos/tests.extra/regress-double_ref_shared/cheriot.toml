name = "regress-double-reference-shared"
board = "../../sdk/boards/sail.toml"
include = [
    "../../sdk/cheriot.toml",
]
sdk = "../../sdk"

[services.top]
kind = "compartment"

[services.top.build]
sources = [
    "top1.cc",
    "top2.cc",
]

[services.top.build.shared_objects]
foo = 4

[[firmwares]]
name = "top_compartment"
libraries = [
    "freestanding",
    "debug",
]
services = [
    "top",
]

[[firmwares.threads]]
name = "top"
compartment = "top"
entry = "entry"
priority = 1
stack_size = 512
trusted_stack_frames = 1
