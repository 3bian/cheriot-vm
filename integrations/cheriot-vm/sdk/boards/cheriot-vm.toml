name = "cheriot-vm"
cpu = "cheriot"
defines = ["RISCV_HTIF"]
driver_includes = ["${sdk}/include/platform/cheriot-vm", "${sdk}/include/platform/generic-riscv"]
interrupts = [
    { name = "GpioInterrupt", number = 2, priority = 2 },
    { name = "SpiInterrupt", number = 3, priority = 2 },
    { name = "I2cInterrupt", number = 4, priority = 2 },
    { name = "EthernetInterrupt", number = 5, priority = 2 },
    { name = "StorageInterrupt", number = 6, priority = 2 },
]
revoker = "software"
simulation = true
tickrate_hz = 10
timer_hz = 2000

